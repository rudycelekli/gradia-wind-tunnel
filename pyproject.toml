[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gradia-wind-tunnel"
version = "1.0.0"
description = "An evaluation immune system: adversarial repair of benchmark scorers, oracle-witnessed and verifiable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rudy Celekli" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
real = ["datasets"]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
gradia-wind-tunnel = "gradia_wind_tunnel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gradia_wind_tunnel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Scope is deliberate. We enforce pyflakes (F) -- the family that catches real
# defects (undefined names, genuinely dead imports/vars, f-string mistakes).
# Stylistic families are intentionally NOT enforced so the released tree stays
# byte-identical to the exact source that produced every committed evidence
# bundle: the compact one-statement-per-line guards this codebase favours
# (E701/E702), isort-style import ordering (I), and pyupgrade rewrites (UP) are
# deliberate style / accepted debt, not defects. `make lint` (ruff check src) is
# clean under this scope; the 165-check suite (make test) is the behavioural gate.
select = ["F"]
ignore = ["F841"]  # a few named intermediates kept inline for readability/debugging

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F811"]  # deliberate public-API re-export hub

[tool.mypy]
python_version = "3.11"
exclude = ["src/gradia_wind_tunnel/tests.py"]  # executable property suite; checked by make test
ignore_missing_imports = true      # optional gradia_universes / gradia bindings
check_untyped_defs = true
# research code: enforce the checks that catch real bugs, not annotation completeness
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
